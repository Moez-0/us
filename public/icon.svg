      <stop offset="0%" stop-color="#E27D60" />
      <stop offset="50%" stop-color="#C25975" />
      <stop offset="100%" stop-color="#7B506F" />
    </linearGradient>
    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
